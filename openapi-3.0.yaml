        female:
          $ref: "#/components/schemas/ClassAppearance"
    ClassAppearance:
      type: object
      description: Structured client appearance data for an asset renderer. Bone and skin IDs are not image URLs. Use the parent record's image_urls for ready-to-display artwork.
      required: [bones_id, skin_ids, scale_percent, default_colors]
      properties:
        bones_id:
