        random: {type: integer}
        random_group: {type: integer}
        sequence_group: {type: integer}
        activation_mask: {$ref: "#/components/schemas/TargetMask"}
        caster_mask: {$ref: "#/components/schemas/TargetMask"}
        target_mask: {$ref: "#/components/schemas/TargetMask"}
        activation_zone: {$ref: "#/components/schemas/EffectZone"}
        target_zone: {$ref: "#/components/schemas/EffectZone"}
        condition:
