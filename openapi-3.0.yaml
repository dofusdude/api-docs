            y:
              type: integer
        default_colors:
          type: array
          items:
            type: integer
    Monster:
      type: object
      description: A monster with its grades, family, spawn locations and drops. Spell expansion is optional.
      required: [ankama_id, name, race, grades, spawn_locations, drops]
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        image_urls:
          $ref: "#/components/schemas/Images"
        race:
          $ref: "#/components/schemas/MonsterRace"
        grades:
          type: array
          description: Variants of this monster. Each has its own combat level, statistics and assigned spells. The monster grade number is not a spell grade number or combat level.
          items:
            $ref: "#/components/schemas/MonsterGrade"
        spawn_locations:
          type: array
          description: Known spawn subareas and their geographic parents. This is not live population data or a per-map spawn probability. Maps listed within a subarea are not guaranteed individual spawn points.
          items:
            $ref: "#/components/schemas/MonsterSpawnLocation"
        drops:
          type: array
          items:
            $ref: "#/components/schemas/MonsterDrop"
        global_drops:
          type: array
          items:
            $ref: "#/components/schemas/MonsterGlobalDrop"
        appearance:
          $ref: "#/components/schemas/ClassAppearance"
        is_bounty:
          type: boolean
        corresponding_mini_boss:
          $ref: "#/components/schemas/CombatReference"
        summon_cost:
          type: integer
        speed_adjust:
          type: integer
        scale_grade_reference:
          type: integer
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/CombatReference"
        souls:
          type: array
          items:
            type: object
            additionalProperties: true
        characteristic_ratios:
          type: array
          items:
            type: array
            items: {type: number, format: double}
      additionalProperties: true
    MonsterRace:
      type: object
      description: Monster taxonomy. Race is the monster's family and super_race is the broader grouping. Neither is a playable class or a monster grade.
      required: [ankama_id, name, super_race]
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        super_race:
          $ref: "#/components/schemas/CombatReference"
    MonsterGrade:
      type: object
      description: One variant of this monster, combining combat level, statistics and spell assignments. Match grade-specific drop rates using its grade value. Do not use it to infer a spell grade.
      required: [grade, level, spells]
      properties:
        grade:
          type: integer
          description: Number identifying this variant within the monster. Not the combat level, array position or grade of an assigned spell.
        level:
          type: integer
          description: Combat level of this monster variant. Distinct from its grade number.
        life_points: {type: integer}
        action_points: {type: integer}
        movement_points: {type: integer}
        grade_xp: {type: integer}
        neutral_resistance: {type: integer}
        earth_resistance: {type: integer}
        fire_resistance: {type: integer}
        water_resistance: {type: integer}
        air_resistance: {type: integer}
        pa_dodge: {type: integer}
        pm_dodge: {type: integer}
        damage_bonus: {type: integer}
        percent_damage_bonus: {type: integer}
        critical_hit_bonus: {type: integer}
        initiative_bonus: {type: integer}
        tackle_bonus: {type: integer}
        tackle_evade: {type: integer}
        max_summon: {type: integer}
        bonus_characteristics:
          type: object
          additionalProperties: {type: integer}
        spells:
          type: array
          description: Spells assigned to this exact monster grade.
          items:
            oneOf:
              - $ref: "#/components/schemas/MonsterSpellRelationship"
              - $ref: "#/components/schemas/Spell"
      additionalProperties: true
    MonsterSpellRelationship:
      type: object
      description: Compact spell assignment inside one monster grade. The assignment's grade identifies the spell variant, not the enclosing monster variant. Follow url unchanged to retrieve it or use an include option to embed it.
      required: [ankama_id, name, grade, url]
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        grade:
          type: integer
          description: Grade of the assigned spell. It does not need to equal the enclosing MonsterGrade.grade.
        url:
          type: string
          format: uri
          description: URL for the assigned spell grade. Includes the `grade` query parameter.
        image_urls:
          $ref: "#/components/schemas/Images"
    MonsterSpawnLocation:
      type: object
      description: Known spawn subarea with its parent area, super-area and map membership. Does not assert a spawn on each listed map and does not include spawn probabilities.
      required: [subarea, area, super_area, subarea_maps, preferred]
      properties:
        subarea:
          $ref: "#/components/schemas/CombatReference"
        area:
          $ref: "#/components/schemas/CombatReference"
        super_area:
          $ref: "#/components/schemas/CombatReference"
        subarea_maps:
          type: array
          description: Maps belonging to the referenced subarea. Map membership alone is not proof that the monster spawns on a particular map.
          items:
            type: object
            required: [ankama_id, position_x, position_y, world_map_id]
            properties:
              ankama_id:
                type: integer
              position_x:
                type: integer
              position_y:
                type: integer
              world_map_id:
                type: integer
                description: World-map context for these coordinates. Coordinates alone are not a globally unique map identifier.
        preferred:
          type: boolean
          description: Whether the source marks this as a preferred subarea. A preference flag, not a spawn percentage or guarantee of presence.
    EligibilityNode:
      type: object
      description: Client-side conditions using the v1 condition-node structure. Confirmed server-owned predicates are excluded during mapping. This is not the complete server eligibility formula, and the API does not dynamically remove fields based on interpretation status.
      properties:
        is_operand: {type: boolean}
        relation: {type: string, enum: [and, or]}
        children:
          type: array
          items: {$ref: "#/components/schemas/EligibilityNode"}
        condition:
          type: object
          properties:
            operator: {type: string}
            int_value: {type: integer}
            quantity: {type: integer}
            kind:
              type: string
              description: Verified semantic requirement type, for example item_received_age or profession_level.
            unit: {type: string}
            string_value: {type: string}
            value_label: {type: string}
            element:
              type: object
              properties:
                id:
                  type: integer
                  description: Existing persisted item-condition element ID, or -1 for a condition without a persisted ID.
                name: {type: string}
            reference: {$ref: "#/components/schemas/CombatReference"}
            secondary_reference: {$ref: "#/components/schemas/CombatReference"}
    MonsterDrop:
      type: object
      description: A possible item drop with base rates indexed by monster grade. Final player-specific chances also depend on conditions and game modifiers.
      required: [item, rates_percent, has_conditions]
      properties:
        item:
          $ref: "#/components/schemas/CombatReference"
        rates_percent:
          type: array
          description: Base drop percentages indexed by MonsterGrade.grade, not spell grade or array position. A value of 5 means 5 percent, not 0.05 percent. These are not spawn percentages.
          items:
            type: object
            required: [grade, percent]
            properties:
              grade:
                type: integer
              percent:
                type: number
                format: double
        has_conditions:
          type: boolean
          description: The source reports restrictions. Can be true without a complete client-side condition tree because server-only predicates are not exposed.
        drop_id: {type: integer}
        count: {type: integer}
        condition:
          type: object
          nullable: true
          additionalProperties: true
        hidden_if_invalid_conditions: {type: boolean}
        disable_drop_modifier: {type: boolean}
        specific_coefficients:
          type: array
          items:
            type: object
            additionalProperties: true
    MonsterGlobalDrop:
      type: object
      description: A separate global-drop entry with a base percentage range. It is not the per-monster-grade rates table and does not by itself define a final player-specific drop chance.
      required: [item, min_percent, max_percent]
      properties:
        has_conditions: {type: boolean}
        item:
          $ref: "#/components/schemas/CombatReference"
        min_percent: {type: number, format: double}
        max_percent: {type: number, format: double}
        condition:
          type: object
          nullable: true
          additionalProperties: true
        alteration_id: {type: integer}
        disable_drop_modifier: {type: boolean}
    WorldArea:
      type: object
      description: Geographic data from a super-area, area or subarea endpoint. The hierarchy is super-area to area to subarea to map. Field availability depends on the selected geographic resource. Unrelated to combat-cell effect zones.
      required: [ankama_id, name]
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        world_map_id:
          type: integer
          description: World-map context supplied on super-area records.
        areas:
          type: array
          description: Child area references supplied on super-area records.
          items:
            $ref: "#/components/schemas/CombatReference"
        level:
