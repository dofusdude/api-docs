components:
  parameters:
    Game:
      name: game
      in: path
      required: true
      schema:
        type: string
        enum:
          - dofus3
        default: dofus3
    Language:
      name: language
      in: path
      required: true
      schema:
        type: string
        enum:
          - en
          - fr
          - de
          - es
          - pt
        example: en
    PageNumber:
      name: page[number]
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MonsterSpellInclude:
      name: include
      in: query
      description: Optional spell expansion for monster responses. Leave include unset to return spell URLs. Use `spells.grade` to embed the assigned spell grade. Use `spells` to embed every available grade of each assigned spell.
      schema:
        type: string
        enum:
          - spells.grade
          - spells
  schemas:
    MappedEntityListEntry:
      type: object
      description: Compact collection summary. A missing detail field here does not mean the resource lacks that data. Request the single-record endpoint or the collection's full fields to obtain details.
      required:
        - ankama_id
        - name
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        image_urls:
          $ref: "#/components/schemas/Images"
    MappedEntityCollection:
      type: object
      description: The populated array property matches the selected resource.
      properties:
        classes:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/MappedEntityListEntry"
              - $ref: "#/components/schemas/Class"
        spells:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/MappedEntityListEntry"
              - $ref: "#/components/schemas/Spell"
        monsters:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/MappedEntityListEntry"
              - $ref: "#/components/schemas/Monster"
        super_areas:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/MappedEntityListEntry"
              - $ref: "#/components/schemas/WorldArea"
        areas:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/MappedEntityListEntry"
              - $ref: "#/components/schemas/WorldArea"
        subareas:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/MappedEntityListEntry"
              - $ref: "#/components/schemas/WorldArea"
        _links:
          type: object
          additionalProperties: true
    CombatReference:
      type: object
      description: A compact resolved reference, not a complete resource. Interpret the ID in the context of the containing field. IDs in different resource types can have the same numeric value without referring to the same entity.
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        kind:
          type: string
      additionalProperties: true
    CombatCondition:
      type: object
      properties:
        operator:
          type: string
        negated:
          type: boolean
        subject:
          type: string
        reference:
          $ref: "#/components/schemas/CombatReference"
      additionalProperties: true
    TargetSelector:
      type: object
      properties:
        kind:
          type: string
          description: Human-readable target category or relationship.
        code:
          type: string
        name:
          type: string
        description:
          type: string
        subject:
          type: string
        negated:
          type: boolean
        reference:
          $ref: "#/components/schemas/CombatReference"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/CombatCondition"
      additionalProperties: true
    TargetMask:
      type: object
      description: Determines who an effect may affect. Combine the resolved selectors and conditions using logic. This is distinct from the zone geometry and from the event that triggers the effect.
      required:
        - raw
        - selectors
      properties:
        raw:
          type: string
          description: Original game mask retained for lossless debugging.
        logic:
          type: string
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/CombatCondition"
        selectors:
          type: array
          items:
            $ref: "#/components/schemas/TargetSelector"
    SpellTrigger:
      type: object
      properties:
        kind:
          type: string
          description: Resolved event that activates the effect.
        code:
          type: string
        name:
          type: string
        description:
          type: string
        subject:
          type: string
        reference:
          $ref: "#/components/schemas/CombatReference"
      additionalProperties: true
    SpellTriggers:
      type: object
      description: Determines when an effect activates. Events are not additional effects to apply unconditionally. Use logic with the resolved event names and descriptions instead of parsing raw tokens.
      required:
        - raw
        - events
      properties:
        raw:
          type: string
          description: Original trigger tokens retained for lossless debugging.
        logic:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/SpellTrigger"
    ZoneShape:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
          description: Resolved shape name, such as point, circle, cross, line, or cone.
    EffectZone:
      type: object
      description: Combat-cell area for this effect or activation context, not a geographic world area. Shape, size and inner size describe geometry. Actual affected cells can depend on position, direction and fight state. Each spell effect can have a different zone.
      required:
        - shape
        - cell_ids
      properties:
        raw:
          type: string
          description: Original compact zone encoding when the source provides one.
        shape:
          $ref: "#/components/schemas/ZoneShape"
        size:
          type:
            - integer
            - "null"
          description: Effective outer size of the area. A point has size 0. Whole-map and custom-cell shapes omit it.
        min_size:
          type:
            - integer
            - "null"
          description: Effective inner size for hollow or minimum-size shapes. Omitted when the shape has no inner boundary.
        cell_ids:
          type: array
          description: Explicit cells for a custom-cell shape. An empty array is normal for geometric shapes such as circles and does not mean the zone affects no cells.
          items:
            type: integer
        damage_decrease_step_percent:
          type: integer
        max_damage_decrease_apply_count:
          type: integer
        forced_direction:
          type: integer
        include_carried:
          type: boolean
        stop_at_target:
          type: boolean
        only_affect_in_sight_line:
          type: boolean
    WeaponCombat:
      type: object
      description: Weapon attack targeting and area geometry. Available for weapon equipment. This is separate from spell effect zones.
      required:
        - zone
        - cast_in_line
        - cast_in_diagonal
        - requires_line_of_sight
      properties:
        zone:
          $ref: "#/components/schemas/EffectZone"
        cast_in_line:
          type: boolean
        cast_in_diagonal:
          type: boolean
        requires_line_of_sight:
          type: boolean
    SpellEffect:
      type: object
      description: One normal or critical effect of a particular spell grade. Its zone defines where it applies, target_mask defines eligible targets and triggers defines activation events. Templated text is for display, not a formula to parse.
      properties:
        type:
          type: string
          description: Localized effect category, such as Air damage. This is not a spell ID or a structured game reference.
        min:
          type: integer
        max:
          type: integer
        duration:
          type: integer
          description: Effect duration in fight turns as represented by the source. Not a real-time duration in seconds.
        delay:
          type: integer
          description: Delay before the effect in fight turns as represented by the source.
        random:
          type: number
          description: Source random-selection value. Do not interpret it as a percentage without the effect's selection rules.
        group:
          type: integer
        dispellable:
          type: integer
        effect_uid:
          type: integer
          description: Stable identifier of this concrete effect instance.
        target_id:
          type: integer
        triggered_duration:
          type: integer
        display_zero:
          type: boolean
        modifier:
          type: integer
        zone:
          $ref: "#/components/schemas/EffectZone"
        target_mask:
          $ref: "#/components/schemas/TargetMask"
        triggers:
          $ref: "#/components/schemas/SpellTriggers"
        templated:
          type: string
          description: Localized effect text suitable for display. Numeric effect properties remain available separately.
      additionalProperties: true
    SpellLevel:
      type: object
      description: One grade of a spell. The levels array contains these spell variants, not player levels. Grade numbers are local to the containing spell and are independent of monster grades.
      properties:
        ankama_id:
          type: integer
          description: ID of the spell-level definition. Different from the parent spell ID and from the grade number. Used by explicit spell-level references such as script spell_level_ids.
        grade:
          type: integer
          description: Number identifying this variant within its spell. Select by this value, not by the array position. Used by the spell detail endpoint's grade parameter.
        ap_cost:
          type: integer
          description: Action points required to cast this spell grade.
        critical_hit_probability:
          type: integer
          description: Base critical-hit percentage recorded for this spell grade, before fighter-specific modifiers.
        min_player_level:
          type: integer
          description: Player-level requirement recorded for this spell grade. This is not its grade number or a monster combat level.
        min_range:
          type: integer
          description: Minimum casting range in combat cells.
        max_range:
          type: integer
          description: Maximum casting range in combat cells as defined by this grade.
        max_cast_per_turn:
          type: integer
          description: Per-caster cast limit within a turn as recorded by the source.
        max_cast_per_target:
          type: integer
        max_global_cast_per_turn:
          type: integer
        max_global_cast_per_target:
          type: integer
        min_cast_interval:
          type: integer
          description: Minimum interval between casts, measured in fight turns.
        initial_cooldown:
          type: integer
          description: Initial wait before casting, measured in fight turns.
        global_cooldown:
          type: integer
        ignore_prison_glyph:
          type: boolean
        spell_breed:
          type: integer
        states_criterion:
          anyOf:
            - allOf:
                - $ref: "#/components/schemas/EligibilityNode"
              description: Available client-side state requirements for this spell grade. Null does not assert that the server imposes no restriction.
            - type: "null"
        preview_zones:
          type: array
          description: Client preview and activation geometry for this grade. Use each effect's zone for its actual effect-area definition.
          items:
            $ref: "#/components/schemas/SpellPreviewZone"
        effects:
          type: array
          description: Normal-cast effects for this grade. Each entry has independent targeting and area geometry.
          items:
            $ref: "#/components/schemas/SpellEffect"
        critical_effects:
          type: array
          description: Critical-cast effects for this grade. Keep separate from normal effects rather than applying both arrays to every cast.
          items:
            $ref: "#/components/schemas/SpellEffect"
      additionalProperties: true
    Spell:
      type: object
      description: A spell with its available grades, effects and casting rules.
      required:
        - ankama_id
        - name
        - levels
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        description:
          type: string
        icon_id:
          type: integer
        admin_name:
          type: string
        order:
          type: integer
        image_urls:
          $ref: "#/components/schemas/Images"
        type:
          $ref: "#/components/schemas/SpellType"
        base_preview_zone:
          $ref: "#/components/schemas/EffectZone"
          description: Base client preview geometry. Does not replace the independent area of each effect.
        classes:
          type: array
          description: Reverse references to playable classes associated with this spell. These are compact references, not complete class documents.
          items:
            $ref: "#/components/schemas/CombatReference"
        monsters:
          type: array
          description: Reverse references to monsters associated with this spell. Use a monster's grade-specific assignments to determine which spell grade it uses.
          items:
            $ref: "#/components/schemas/CombatReference"
        levels:
          type: array
          description: Available spell grades. Despite the field name, entries are not player levels. A grade-filtered detail response contains only the requested entry while retaining the parent spell object.
          items:
            $ref: "#/components/schemas/SpellLevel"
        scripts:
          type: array
          items:
            $ref: "#/components/schemas/SpellScriptUsage"
        critical_scripts:
          type: array
          items:
            $ref: "#/components/schemas/SpellScriptUsage"
      additionalProperties: true
    SpellType:
      type: object
      description: Classification of a spell, with localized short and long labels. Not a playable class, spell grade or monster family.
      properties:
        ankama_id:
          type: integer
        short_name:
          type: string
        long_name:
          type: string
    SpellPreviewZone:
      type: object
      description: Client preview binding. Activation criteria and display geometry serve a different purpose from an effect's zone.
      properties:
        ankama_id:
          type: integer
        activation_mask:
          $ref: "#/components/schemas/TargetMask"
        caster_mask:
          $ref: "#/components/schemas/TargetMask"
        hidden:
          type: boolean
        activation_zone:
          $ref: "#/components/schemas/EffectZone"
        display_zone:
          $ref: "#/components/schemas/EffectZone"
    SpellScriptUsage:
      type: object
      description: Resolved client-side spell script binding, including target selection and areas.
      properties:
        ankama_id:
          type: integer
        script_id:
          type: integer
        order:
          type: integer
        random:
          type: integer
        random_group:
          type: integer
        sequence_group:
          type: integer
        activation_mask:
          $ref: "#/components/schemas/TargetMask"
        caster_mask:
          $ref: "#/components/schemas/TargetMask"
        target_mask:
          $ref: "#/components/schemas/TargetMask"
        activation_zone:
          $ref: "#/components/schemas/EffectZone"
        target_zone:
          $ref: "#/components/schemas/EffectZone"
        condition:
          type:
            - object
            - "null"
          additionalProperties: true
        targets_affected_concurrently:
          type: boolean
        target_treated_as_caster:
          type: boolean
        spell_level_ids:
          type: array
          description: Spell-level definition IDs to which this script binding applies. Match SpellLevel.ankama_id, not Spell.ankama_id or SpellLevel.grade.
          items:
            type: integer
    Class:
      type: object
      description: A playable class with its characteristics, appearance and class spell assignments.
      required:
        - ankama_id
        - name
        - looks
        - spells
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        description:
          type: string
        gameplay_description:
          type: string
        complexity:
          type: integer
        sort_index:
          type: integer
        creature_bones_id:
          type: integer
        roles:
          type: array
          items:
            type: object
            additionalProperties: true
        characteristic_costs:
          type: object
          description: Characteristic point-cost tiers keyed by characteristic name.
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                from:
                  type: integer
                cost:
                  type: integer
        image_urls:
          $ref: "#/components/schemas/Images"
        looks:
          $ref: "#/components/schemas/ClassLooks"
        spells:
          type: array
          description: Full spell definitions assigned to this playable class, including their own grades, effects and targeting. A class has no monster-grade dimension. The same spells are independently available from the spells endpoint.
          items:
            $ref: "#/components/schemas/Spell"
      additionalProperties: true
    ClassLooks:
      type: object
      required:
        - male
        - female
      properties:
        male:
          $ref: "#/components/schemas/ClassAppearance"
        female:
          $ref: "#/components/schemas/ClassAppearance"
    ClassAppearance:
      type: object
      description: Structured client appearance data for an asset renderer. Bone and skin IDs are not image URLs. Use the parent record's image_urls for ready-to-display artwork.
      required:
        - bones_id
        - skin_ids
        - scale_percent
        - default_colors
      properties:
        bones_id:
          type: integer
        skin_ids:
          type: array
          items:
            type: integer
        scale_percent:
          type: object
          required:
            - x
            - y
          properties:
            x:
              type: integer
            y:
              type: integer
        default_colors:
          type: array
          items:
            type: integer
    Monster:
      type: object
      description: A monster with its grades, family, spawn locations and drops. Spell expansion is optional.
      required:
        - ankama_id
        - name
        - race
        - grades
        - spawn_locations
        - drops
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        image_urls:
          $ref: "#/components/schemas/Images"
        race:
          $ref: "#/components/schemas/MonsterRace"
        grades:
          type: array
          description: Variants of this monster. Each has its own combat level, statistics and assigned spells. The monster grade number is not a spell grade number or combat level.
          items:
            $ref: "#/components/schemas/MonsterGrade"
        spawn_locations:
          type: array
          description: Known spawn subareas and their geographic parents. This is not live population data or a per-map spawn probability. Maps listed within a subarea are not guaranteed individual spawn points.
          items:
            $ref: "#/components/schemas/MonsterSpawnLocation"
        drops:
          type: array
          items:
            $ref: "#/components/schemas/MonsterDrop"
        global_drops:
          type: array
          items:
            $ref: "#/components/schemas/MonsterGlobalDrop"
        appearance:
          $ref: "#/components/schemas/ClassAppearance"
        is_bounty:
          type: boolean
        corresponding_mini_boss:
          $ref: "#/components/schemas/CombatReference"
        summon_cost:
          type: integer
        speed_adjust:
          type: integer
        scale_grade_reference:
          type: integer
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/CombatReference"
        souls:
          type: array
          items:
            type: object
            additionalProperties: true
        characteristic_ratios:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
      additionalProperties: true
    MonsterRace:
      type: object
      description: Monster taxonomy. Race is the monster's family and super_race is the broader grouping. Neither is a playable class or a monster grade.
      required:
        - ankama_id
        - name
        - super_race
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        super_race:
          $ref: "#/components/schemas/CombatReference"
    MonsterGrade:
      type: object
      description: One variant of this monster, combining combat level, statistics and spell assignments. Match grade-specific drop rates using its grade value. Do not use it to infer a spell grade.
      required:
        - grade
        - level
        - spells
      properties:
        grade:
          type: integer
          description: Number identifying this variant within the monster. Not the combat level, array position or grade of an assigned spell.
        level:
          type: integer
          description: Combat level of this monster variant. Distinct from its grade number.
        life_points:
          type: integer
        action_points:
          type: integer
        movement_points:
          type: integer
        grade_xp:
          type: integer
        neutral_resistance:
          type: integer
        earth_resistance:
          type: integer
        fire_resistance:
          type: integer
        water_resistance:
          type: integer
        air_resistance:
          type: integer
        pa_dodge:
          type: integer
        pm_dodge:
          type: integer
        damage_bonus:
          type: integer
        percent_damage_bonus:
          type: integer
        critical_hit_bonus:
          type: integer
        initiative_bonus:
          type: integer
        tackle_bonus:
          type: integer
        tackle_evade:
          type: integer
        max_summon:
          type: integer
        bonus_characteristics:
          type: object
          additionalProperties:
            type: integer
        spells:
          type: array
          description: Spells assigned to this exact monster grade.
          items:
            oneOf:
              - $ref: "#/components/schemas/MonsterSpellRelationship"
              - $ref: "#/components/schemas/Spell"
      additionalProperties: true
    MonsterSpellRelationship:
      type: object
      description: Compact spell assignment inside one monster grade. The assignment's grade identifies the spell variant, not the enclosing monster variant. Follow url unchanged to retrieve it or use an include option to embed it.
      required:
        - ankama_id
        - name
        - grade
        - url
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        grade:
          type: integer
          description: Grade of the assigned spell. It does not need to equal the enclosing MonsterGrade.grade.
        url:
          type: string
          format: uri
          description: URL for the assigned spell grade. Includes the `grade` query parameter.
        image_urls:
          $ref: "#/components/schemas/Images"
    MonsterSpawnLocation:
      type: object
      description: Known spawn subarea with its parent area, super-area and map membership. Does not assert a spawn on each listed map and does not include spawn probabilities.
      required:
        - subarea
        - area
        - super_area
        - subarea_maps
        - preferred
      properties:
        subarea:
          $ref: "#/components/schemas/CombatReference"
        area:
          $ref: "#/components/schemas/CombatReference"
        super_area:
          $ref: "#/components/schemas/CombatReference"
        subarea_maps:
          type: array
          description: Maps belonging to the referenced subarea. Map membership alone is not proof that the monster spawns on a particular map.
          items:
            type: object
            required:
              - ankama_id
              - position_x
              - position_y
              - world_map_id
            properties:
              ankama_id:
                type: integer
              position_x:
                type: integer
              position_y:
                type: integer
              world_map_id:
                type: integer
                description: World-map context for these coordinates. Coordinates alone are not a globally unique map identifier.
        preferred:
          type: boolean
          description: Whether the source marks this as a preferred subarea. A preference flag, not a spawn percentage or guarantee of presence.
    EligibilityNode:
      type: object
      description: Client-side conditions using the v1 condition-node structure. Confirmed server-owned predicates are excluded during mapping. This is not the complete server eligibility formula, and the API does not dynamically remove fields based on interpretation status.
      properties:
        is_operand:
          type: boolean
        relation:
          type: string
          enum:
            - and
            - or
        children:
          type: array
          items:
            $ref: "#/components/schemas/EligibilityNode"
        condition:
          type: object
          properties:
            operator:
              type: string
            int_value:
              type: integer
            quantity:
              type: integer
            kind:
              type: string
              description: Verified semantic requirement type, for example item_received_age or profession_level.
            unit:
              type: string
            string_value:
              type: string
            value_label:
              type: string
            element:
              type: object
              properties:
                id:
                  type: integer
                  description: Existing persisted item-condition element ID, or -1 for a condition without a persisted ID.
                name:
                  type: string
            reference:
              $ref: "#/components/schemas/CombatReference"
            secondary_reference:
              $ref: "#/components/schemas/CombatReference"
    MonsterDrop:
      type: object
      description: A possible item drop with base rates indexed by monster grade. Final player-specific chances also depend on conditions and game modifiers.
      required:
        - item
        - rates_percent
        - has_conditions
      properties:
        item:
          $ref: "#/components/schemas/CombatReference"
        rates_percent:
          type: array
          description: Base drop percentages indexed by MonsterGrade.grade, not spell grade or array position. A value of 5 means 5 percent, not 0.05 percent. These are not spawn percentages.
          items:
            type: object
            required:
              - grade
              - percent
            properties:
              grade:
                type: integer
              percent:
                type: number
                format: double
        has_conditions:
          type: boolean
          description: The source reports restrictions. Can be true without a complete client-side condition tree because server-only predicates are not exposed.
        drop_id:
          type: integer
        count:
          type: integer
        condition:
          type:
            - object
            - "null"
          additionalProperties: true
        hidden_if_invalid_conditions:
          type: boolean
        disable_drop_modifier:
          type: boolean
        specific_coefficients:
          type: array
          items:
            type: object
            additionalProperties: true
    MonsterGlobalDrop:
      type: object
      description: A separate global-drop entry with a base percentage range. It is not the per-monster-grade rates table and does not by itself define a final player-specific drop chance.
      required:
        - item
        - min_percent
        - max_percent
      properties:
        has_conditions:
          type: boolean
        item:
          $ref: "#/components/schemas/CombatReference"
        min_percent:
          type: number
          format: double
        max_percent:
          type: number
          format: double
        condition:
          type:
            - object
            - "null"
          additionalProperties: true
        alteration_id:
          type: integer
        disable_drop_modifier:
          type: boolean
    WorldArea:
      type: object
      description: Geographic data from a super-area, area or subarea endpoint. The hierarchy is super-area to area to subarea to map. Field availability depends on the selected geographic resource. Unrelated to combat-cell effect zones.
      required:
        - ankama_id
        - name
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        world_map_id:
          type: integer
          description: World-map context supplied on super-area records.
        areas:
          type: array
          description: Child area references supplied on super-area records.
          items:
            $ref: "#/components/schemas/CombatReference"
        level:
          type: integer
          description: Suggested geographic difficulty level supplied on subarea records. Not a monster grade or the level of every monster there.
        dungeon_id:
          type: integer
          description: Dungeon association when supplied by the subarea data.
        maps:
          type: array
          description: Map membership supplied on subarea records. Does not imply a spawn on every map.
          items:
            $ref: "#/components/schemas/WorldMapReference"
        super_area:
          $ref: "#/components/schemas/CombatReference"
        area:
          $ref: "#/components/schemas/CombatReference"
        subareas:
          type: array
          items:
            $ref: "#/components/schemas/CombatReference"
        monsters:
          type: array
          items:
            $ref: "#/components/schemas/CombatReference"
      additionalProperties: true
    WorldMapReference:
      type: object
      description: A map ID and its position within a world-map context. Maps can share coordinates in different contexts.
      properties:
        ankama_id:
          type: integer
        position_x:
          type: integer
        position_y:
          type: integer
        world_map_id:
          type: integer
    ListItemGeneral:
      type: object
      x-examples: {}
      x-stoplight:
        id: r5b3ia3ectz8q
      title: ListItemGeneral
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        type:
          $ref: "#/components/schemas/TranslatedId"
        item_subtype:
          $ref: "#/components/schemas/ItemSubtype"
        level:
          type: integer
        image_urls:
          $ref: "#/components/schemas/Images"
    ListItem:
      type: object
      x-examples: {}
      x-stoplight:
        id: t7g4fratmdgkx
      title: ListItem
      properties:
        ankama_id:
          type: integer
        name:
          type: string
        type:
          $ref: "#/components/schemas/TranslatedId"
        level:
          type: integer
        image_urls:
          $ref: "#/components/schemas/Images"
        recipe:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/Recipe"
        description:
          type:
            - string
            - "null"
          x-stoplight:
            id: t04qfhnlgc4kw
        conditions:
          type:
            - object
            - "null"
          allOf:
            - $ref: "#/components/schemas/ConditionNode"
        effects:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/Effect"
        is_weapon:
          type:
            - boolean
            - "null"
        pods:
          type:
            - integer
            - "null"
        parent_set:
          type:
            - object
            - "null"
          allOf:
            - $ref: "#/components/schemas/TranslatedId"
        critical_hit_probability:
          type:
            - integer
            - "null"
        critical_hit_bonus:
          type:
            - integer
            - "null"
        max_cast_per_turn:
          type:
            - integer
            - "null"
        ap_cost:
          type:
            - integer
            - "null"
        range:
          $ref: "#/components/schemas/Range"
        combat:
          $ref: "#/components/schemas/WeaponCombat"
    Recipe:
      type: object
      properties:
        item_ankama_id:
          type: integer
        item_subtype:
          type: string
        quantity:
          type: integer
      x-examples: {}
